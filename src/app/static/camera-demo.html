<!doctype html>
<!--
  Standalone Plant Tracer camera prototype for local UX iteration.
  Setup opens a live preview and collects the capture settings.
  Start gives the user ten seconds to get ready while showing the preview.
  Recording keeps the preview visible beside the timer and controls.
  Done shows a summary of the capture after the camera is released.
  camera-demo.js manages device access, timing, and screen transitions.
  The static demo runs independently of Flask and the upload pipeline.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plant Tracer Camera Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #f3f6fa;
      background: #10151d;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }

    main {
      width: min(100%, 1120px);
      margin: auto;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem 1rem;
      margin-bottom: 1rem;
    }

    h1, h2, p, figure, dl, dd { margin: 0; }
    h1 { font-size: clamp(1.25rem, 4vw, 1.8rem); }
    h2 { font-size: 1.2rem; overflow-wrap: anywhere; }
    .step, .status, dt { color: #afbdce; font-size: 0.875rem; }

    .layout { display: grid; gap: 1rem; align-items: start; }
    @media (min-width: 700px), (min-width: 520px) and (orientation: landscape) {
      .layout { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
    }

    .preview {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: min(65dvh, 560px);
      border: 1px solid #344457;
      border-radius: 0.8rem;
      background: #070a0e;
    }

    video { display: block; width: 100%; height: 100%; object-fit: contain; }

    #flash {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      display: grid;
      gap: 0.9rem;
      padding: 1rem;
      border: 1px solid #344457;
      border-radius: 0.8rem;
      background: #1a2330;
    }

    .pair, dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .actions { display: flex; gap: 0.75rem; }
    .actions > button { flex: 1; }

    label { display: grid; gap: 0.35rem; font-weight: 600; }
    input, textarea, select, button {
      width: 100%;
      border: 1px solid #506079;
      border-radius: 0.45rem;
      padding: 0.6rem 0.7rem;
      font: inherit;
      color: inherit;
      background: #111925;
    }

    textarea { resize: vertical; }
    button {
      min-height: 44px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }
    :focus-visible { outline: 2px solid #8ac7ff; outline-offset: 2px; }
    .primary, .abort { min-height: 54px; border-color: transparent; }
    .primary { background: #1b5dcc; }
    .abort { background: #aa2938; }

    .timer { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
    #countdown { font-size: 2rem; font-variant-numeric: tabular-nums; }
    #starting {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgb(64 64 64 / 55%);
      color: white;
    }
    #start-countdown {
      font-size: clamp(5rem, 30dvh, 13rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 2px 12px #000;
    }
    #cancel-start {
      position: absolute;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 50%;
      translate: -50% 0;
      width: min(12rem, 80%);
    }
    .metadata { display: grid; gap: inherit; }
    progress {
      display: block;
      width: 100%;
      height: 0.55rem;
      appearance: none;
      border: 0;
      border-radius: 1rem;
      overflow: hidden;
      color: #74b7ff;
      background: #111925;
    }
    progress::-webkit-progress-bar { background: #111925; }
    progress::-webkit-progress-value { background: #74b7ff; }
    progress::-moz-progress-bar { background: #74b7ff; }
    dd { margin-top: 0.25rem; font-variant-numeric: tabular-nums; }
    .status { margin-top: 0.75rem; min-height: 1.2em; }
    #summary { grid-column: 1 / -1; width: min(100%, 32rem); }
    #summary-description { color: #afbdce; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 699px) and (orientation: portrait) {
      .preview { max-height: 36dvh; }
    }

    @media (max-height: 650px) {
      main { padding-top: max(0.5rem, env(safe-area-inset-top)); }
      header { margin-bottom: 0.5rem; }
      .layout, .panel { gap: 0.5rem; }
      .panel { padding: 0.65rem; }
      .primary, .abort { min-height: 44px; }
    }

    @media (max-height: 650px) and (max-width: 699px) and (orientation: portrait) {
      .preview { max-height: 28dvh; }
    }

    @media (max-height: 420px) and (min-width: 520px) and (orientation: landscape) {
      .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      header { gap: 0.25rem; }
      label { gap: 0.25rem; font-size: 0.875rem; }
      input, textarea, select { padding-block: 0.4rem; }
      .metadata { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
      .metadata label { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Plant Tracer Camera</h1>
      <p id="step" class="step">Setup</p>
    </header>
    <section id="home" class="panel" hidden>
      <button id="open-camera" class="primary" type="button">OPEN CAMERA</button>
    </section>
    <div id="camera" class="layout">
      <figure id="preview-panel" class="preview">
        <video id="preview" aria-label="Live camera preview" autoplay muted playsinline></video>
      </figure>
      <form id="setup" class="panel">
        <div class="metadata">
          <label>Title <input id="title" minlength="4" maxlength="256" required></label>
          <label>Description <textarea id="description" rows="2" minlength="4" maxlength="1024" required></textarea></label>
        </div>
        <div class="pair">
          <label>Frame interval
            <select id="interval">
              <option value="15">15 s</option>
              <option value="30">30 s</option>
              <option value="60" selected>1 min</option>
              <option value="120">2 min</option>
              <option value="300">5 min</option>
            </select>
          </label>
          <label>Maximum duration
            <select id="duration">
              <option value="1">1 hour</option>
              <option value="2">2 hours</option>
              <option value="3">3 hours</option>
              <option value="4">4 hours</option>
            </select>
          </label>
        </div>
        <button id="enable-camera" type="button" hidden>Enable camera</button>
        <button id="enable-motion" type="button" hidden>Enable motion tracking</button>
        <div class="actions">
          <button id="start" class="primary" disabled>START</button>
          <button id="abort-setup" class="abort" type="button">ABORT</button>
        </div>
      </form>
      <section id="recording" class="panel" aria-label="Recording controls" hidden>
        <div class="timer">
          <span id="countdown-label">Next shutter</span>
          <time id="countdown">0:00</time>
        </div>
        <progress id="progress" max="1" value="0" aria-labelledby="countdown-label"></progress>
        <dl>
          <div><dt>Start time</dt><dd id="start-time"></dd></div>
          <div><dt>Frames captured</dt><dd id="frame-count">0</dd></div>
        </dl>
        <div class="actions">
          <button id="done" class="primary" type="button">DONE</button>
          <button id="abort-recording" class="abort" type="button">ABORT</button>
        </div>
      </section>
      <section id="summary" class="panel" aria-label="Recording summary" hidden>
        <h2 id="summary-title"></h2>
        <p id="summary-description"></p>
        <p id="summary-count"></p>
        <button id="new-recording" class="primary" type="button">NEW RECORDING</button>
      </section>
    </div>
    <p id="status" class="status" role="status"></p>
  </main>
  <section id="starting" aria-label="Start countdown" hidden>
    <p id="start-countdown" role="timer" aria-label="Seconds before recording" aria-live="polite">10</p>
    <button id="cancel-start" class="abort" type="button">CANCEL</button>
  </section>
  <div id="flash" aria-hidden="true"></div>
  <script type="module" src="./camera-demo.js?v=2"></script>
</body>
</html>
