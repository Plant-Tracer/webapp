# -----------------------------------------------------------------------------
# Plant Tracer Lambda-only stack.
#
# Creates:
# - HTTP API custom domain
# - lambda-web for Flask HTML, Flask /api/*, and /static/*
# - lambda-resize for /resize-api/* and SQS trace work
# - SQS queue for long-running traces
#
# Durable data is external to this stack:
# - The movie/frame S3 bucket already exists and must outlive the stack.
# - DynamoDB tables are created by src/dbutil.py from etc/dynamodb_tables.json.
# -----------------------------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Plant Tracer Lambda-only web stack. One HTTP API routes Flask web traffic to
  lambda-web and video/tracing traffic to lambda-resize.

Parameters:
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for planttracer.com (e.g., Z123ABC...)
    Default: "Z02875141U8JDG1N8N5BO"

  BaseDomain:
    Type: String
    Description: "Base domain in which the application hostname is created."
    Default: "planttracer.com"

  WildcardCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:343218180669:certificate/66c18f6a-49b3-4be7-a232-a371cbfef29b"
    Description: "Wildcard certificate for the application hostname."

  ImageBucketName:
    Type: String
    Description: "Existing S3 bucket for videos; must outlive the stack. Do not include s3://."
    Default: planttracer2

  ServerEmail:
    Type: String
    Default: admin@planttracer.com
    Description: "Sender address for application mail."

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [CRITICAL, ERROR, WARNING, INFO, DEBUG, NOTSET]
    Description: Default LOG_LEVEL environment value for the functions.

  DynamoDBTablePrefix:
    Type: String
    Description: "Prefix for DynamoDB table names and DYNAMODB_TABLE_PREFIX. Include any separator, e.g. prod-."
    MinLength: 1
    MaxLength: 220
    AllowedPattern: "[A-Za-z0-9_.-]+"
    ConstraintDescription: "Use only letters, numbers, dots, hyphens, and underscores."

Resources:
  ################################################################
  ### DynamoDB tables are created outside CloudFormation.
  ### Run src/dbutil.py createdb with DYNAMODB_TABLE_PREFIX set; table
  ### definitions are in etc/dynamodb_tables.json.

  HomeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        EnableIamAuthorizer: true
        DefaultAuthorizer: AWS_IAM
      Domain:
        DomainName: !Sub "${AWS::StackName}.${BaseDomain}"
        CertificateArn: !Ref WildcardCertificateArn
        Route53:
          HostedZoneId: !Ref HostedZoneId

  LambdaWebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaWebFunction}"
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  LambdaResizeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaResizeFunction}"
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  LambdaWebExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaWebS3DdbAndMailAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketCORS
                  - s3:PutBucketCORS
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}/*"
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTablePrefix}*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTablePrefix}*/index/*"
              - Effect: Allow
                Action:
                  - ses:VerifyEmailIdentity
                  - ses:ListIdentities
                  - ses:GetSendQuota
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"

  LambdaResizeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaResizeS3DdbAndSqsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ImageBucketName}/*"
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTablePrefix}*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTablePrefix}*/index/*"
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ReceiveMessage
                  - sqs:SendMessage
                Resource: !GetAtt TracingQueue.Arn

  TracingQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VisibilityTimeout: 900

  LambdaWebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        RequirementsFile: requirements.txt
    Properties:
      Role: !GetAtt LambdaWebExecutionRole.Arn
      Runtime: python3.12
      Architectures: [arm64]
      PackageType: Zip
      CodeUri: lambda-web/src/
      Handler: lambda_web.main.lambda_handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_PREFIX: !Ref DynamoDBTablePrefix
          LOG_LEVEL: !Ref LogLevel
          PLANTTRACER_LAMBDA_API_BASE: !Sub "https://${AWS::StackName}.${BaseDomain}/"
          PLANTTRACER_S3_BUCKET: !Ref ImageBucketName
          PLANTTRACER_WEB_RUNTIME: lambda
          SERVER_EMAIL: !Ref ServerEmail
      Events:
        WebRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HomeHttpApi
            Path: /
            Method: ANY
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE
        WebProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HomeHttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE

  LambdaResizeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        RequirementsFile: requirements.txt
    Properties:
      Role: !GetAtt LambdaResizeExecutionRole.Arn
      Runtime: python3.12
      Architectures: [arm64]
      PackageType: Zip
      CodeUri: lambda-resize/src/
      Handler: resize_app.main.lambda_handler
      Timeout: 900
      MemorySize: 1024
      Layers:
        - arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV2-Arm64:60
      Environment:
        Variables:
          DYNAMODB_TABLE_PREFIX: !Ref DynamoDBTablePrefix
          LOG_LEVEL: !Ref LogLevel
          PLANTTRACER_S3_BUCKET: !Ref ImageBucketName
          POWERTOOLS_EVENT_HANDLER_AUTO_JSON_DECIMAL: "true"
          POWERTOOLS_SERVICE_NAME: "planttracer"
          TABLE_PREFIX: !Ref DynamoDBTablePrefix
          TRACING_QUEUE_URL: !Ref TracingQueue
      Events:
        ResizeApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HomeHttpApi
            Path: /resize-api/{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE
        TracingQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TracingQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiId:
    Description: HTTP API ID
    Value: !Ref HomeHttpApi
  ApplicationDnsName:
    Description: DNS name for the Lambda-only application
    Value: !Sub "${AWS::StackName}.${BaseDomain}"
  ApplicationUrl:
    Description: HTTPS URL for the Lambda-only application
    Value: !Sub "https://${AWS::StackName}.${BaseDomain}/"
  LambdaDnsName:
    Description: DNS name for compatibility with existing Makefile smoke checks
    Value: !Sub "${AWS::StackName}.${BaseDomain}"
  LambdaWebFunction:
    Description: Plant Tracer Flask web Lambda function name
    Value: !Ref LambdaWebFunction
  LambdaResizeFunction:
    Description: Plant Tracer video/trace Lambda function name
    Value: !Ref LambdaResizeFunction
  TracingQueueUrl:
    Description: SQS queue URL for trace work
    Value: !Ref TracingQueue
