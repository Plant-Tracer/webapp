[project]
name = "webapp"
version = "0.9.9.8"
description = "PlantTracer webapp"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
    { name = "Steve Barber", email = "sbarber2@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "apig-wsgi>=2.20,<3",
    "boto3>=1.42.72,<2",
    "crossplane",
    "cryptography",
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "filetype",
    "flask",
    "gunicorn",
    "html5lib>=1.1,<2",
    "html5validate>=0.0.2,<0.1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "magnum",
    "mutagen",
    "pillow>=12.3,<13",
    "pydantic",
    "pyjwt>=2.10.1,<3",
    "python-magic",
    "requests>=2.32.4,<3",
    "tabulate",
    "validate-email-address",
    "xlsxwriter>=3.2.9,<4",
]

[project.scripts]
sam-config-tool = "sam_config_tool:main"
lambda-resize-cli = "lambda_resize_cli:main"
planttracer-local-trace = "app.local_trace_cli:main"
dbutil = "dbutil:main"
dbbackup = "dbbackup:main"
deployed_workflow_test = "deployed_workflow_test:main"
s3_upload_trigger = "s3_upload_trigger:main"

[dependency-groups]
dev = [
    "aws-lambda-powertools",
    "boto3>=1.42.72,<2",
    "boto3-stubs[essential]",
    "botocore[crt]>=1.42.63,<2",
    "cfn-lint>=1.43.4,<2",
    "codecov",
    "crossplane",
    "cryptography",
    "dnspython>=2.7.0,<3",
    "email-validator>=2.2.0,<3",
    "filetype>=1.2.0",
    "flask",
    "gunicorn",
    "html5lib>=1.1,<2",
    "html5validate",
    "imageio-ffmpeg>=0.6,<0.7",
    "itsdangerous>=2.2.0,<3",
    "jinja2>=3.1.6,<4",
    "localmail>=0.5.0,<0.6",
    "magnum",
    "mutagen",
    "myst-parser",
    "opencv-python-headless",
    "pillow>=12.3,<13",
    "pydantic",
    "pyjwt>=2.10.1,<3",
    "pylint>=3.3.8",
    "pyright",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-env>=1.7.0,<2",
    "pytest-mock>=3.15.1",
    "python-magic",
    "requests>=2.32.4,<3",
    "ruff",
    "selenium>=4.38.0,<5",
    "service-identity",
    "setuptools>=30,<82",
    "sphinx",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",
    "tabulate",
    "tomlkit>=0.15.0,<0.16",
    "types-requests",
    "validate-email-address",
    "xlsxwriter>=3.2.9,<4",
]
lambda = [
    "imageio-ffmpeg>=0.6,<0.7",
    "mutagen",
    "opencv-python-headless",
    "pydantic",
]
lambda-web = [
    "apig-wsgi>=2.20,<3",
    "aws-lambda-powertools",
    "boto3>=1.42.72,<2",
    "email-validator>=2.2,<3",
    "filetype",
    "flask",
    "html5lib>=1.1,<2",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "mutagen",
    "pillow>=12.3,<13",
    "pydantic",
    "pyjwt>=2.10.1,<3",
    "python-magic",
    "requests>=2.32.4,<3",
    "tabulate",
    "validate-email-address",
    "xlsxwriter>=3.2.9,<4",
]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "bin/deployed_workflow_test.py",
    "etc/s3_upload_trigger.py",
    "etc/sam_config_tool.py",
    "lambda-resize/src/lambda_resize_cli.py",
    "src/app",
    "src/dbbackup.py",
    "src/dbutil.py",
]

[tool.hatch.build.targets.wheel.sources]
"bin" = ""
"etc" = ""
"lambda-resize/src" = ""
"src" = ""

[tool.pylint.main]
# Specify the Python version Pylint should assume for syntax checking.
py-version = "3.12"
recursive = true
source-roots = [".", "src", "lambda-web/src", "lambda-resize/src"]
init-hook = "import sys; sys.path.insert(0, '.'); sys.path.insert(0, 'lambda-resize/src'); sys.path.insert(0, 'lambda-web/src'); sys.path.insert(0, 'src');"
ignore-paths = [
    "^lambda-resize/src/resize_app/src/.*$",
    "^lambda-web/src/app/.*$",
    "^resize_app/.*$"
]

[tool.pylint.messages_control]
# Disable specific messages by their symbolic name or message ID.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "unspecified-encoding",
    "redefined-outer-name",
    "unused-argument",
    "invalid-name",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "fixme",
    "trailing-whitespace",      # AI does this
    "trailing-newlines",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-lines",
    "too-few-public-methods",
    "too-many-branches"
]

[tool.pylint.design]
max-args = 10
max-public-methods = 20

[tool.pylint.typecheck]
# av is a C extension used by lambda-resize; allow it so E0401 is not raised.
extension-pkg-allow-list = ["av"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "./"
venv = ".venv"
include = ["."]
exclude = [
  "**/build",
  "**/.aws-sam",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/conftest.py"
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src", "lambda-web/src", "lambda-resize/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["*_test.py", "test_*.py"]
norecursedirs = ["lib/ctools"]
log_cli = true

filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources",
  "ignore:pkg_resources is deprecated:UserWarning",
]

markers = [
  "selenium: marks tests that require Selenium WebDriver (deselect with '-m \"not selenium\"')",
]

env = [
    "PYTEST=1",
    "AWS_REGION=local",
    "AWS_CONFIG_FILE=/dev/null"
    ]
