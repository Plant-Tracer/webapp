name: Frame-step browser conformance

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  desktop:
    name: ${{ matrix.os }} Chrome
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
      - name: Install test dependencies
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then choco install -y make; fi
          python -m pip install --user pipx
          python -m pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          pipx install poetry
          poetry install
      - name: Verify frame stepping
        run: make frame-step-browser-test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
      - name: Install test dependencies
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          export PATH="$HOME/.local/bin:$PATH"
          pipx install poetry
          poetry install
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android Chrome frame stepping
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # ChromeDriver targets com.android.chrome; the default AOSP image
          # intentionally does not include it.
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          script: |
            adb shell pm path com.android.chrome
            export CHROME_ANDROID_SERIAL=emulator-5554
            make frame-step-browser-test
